name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. 逻辑测试：纯 Foundation，Linux 上秒级跑完，对应验收标准 ──
  test:
    name: 逻辑测试
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        id: t
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test.log

      - name: 回报结果
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/out
          {
            echo "job=test"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "time=$(date -u +%FT%TZ)"
            echo
            echo "======== 日志（末尾 200 行）========"
            tail -n 200 /tmp/test.log 2>/dev/null || echo "(无日志)"
          } > /tmp/out/report.txt
          cd /tmp/out
          git init -q
          git config user.email ci@local
          git config user.name ci
          git add -A
          git commit -qm "test report ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-test

  # ── 2. 无签名编译：证明 watchOS 目标真的能编出来（不需要证书）──
  build:
    name: 无签名编译
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（CODE_SIGNING_ALLOWED=NO）
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project WatchStep.xcodeproj \
            -scheme WatchStepWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log

      - name: 回报结果
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/out
          {
            echo "job=build"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "time=$(date -u +%FT%TZ)"
            echo
            echo "======== 日志（末尾 300 行）========"
            tail -n 300 /tmp/build.log 2>/dev/null || echo "(无日志)"
          } > /tmp/out/report.txt
          cd /tmp/out
          git init -q
          git config user.email ci@local
          git config user.name ci
          git add -A
          git commit -qm "build report ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-build
