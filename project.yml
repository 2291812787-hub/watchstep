# XcodeGen 工程描述 —— 不需要 Mac，CI 上自动生成 .xcodeproj
# 关键：默认配置**不要求任何付费能力**（无 Push、无 HealthKit、无 App Groups），
# 所以可以用免费 Apple ID + iLoader 自签，7 天重刷一次即可。
name: WatchStep

options:
  bundleIdPrefix: top.webchangming
  deploymentTarget:
    iOS: "16.0"
    watchOS: "8.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.6"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    # 自签路线：手动签名，不自动要描述文件
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  # ---------- iOS 壳：只是容器 ----------
  WatchStep:
    type: application
    platform: iOS
    sources:
      - Sources/WatchStep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.webchangming.watchstep
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 催步
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: WatchStepWatch
        embed: true

  # ---------- watchOS 独立 App：真正的全部逻辑 ----------
  WatchStepWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/WatchStepWatch
        excludes:
          - "Info.plist"
      - path: Sources/WatchStepCore
    info:
      path: Sources/WatchStepWatch/Info.plist
      properties:
        CFBundleDisplayName: 催步
        CFBundleName: WatchStep
        # 版本号必须和 iPhone 端一致：Apple 要求 companion app 与手表 app 的
        # CFBundleShortVersionString / CFBundleVersion 相同，否则 installd 可能
        # 拒绝安装或事后被 watchOS 移除。Xcode 会展开 $(...) 构建变量。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SwiftUI 单 target watchOS app（无 WatchKit Extension）必须声明 WKApplication=true，
        # 否则 installd 报 InvalidWatchKitApp 拒绝安装（"does not have a WKWatchKitApp or
        # WKApplication key set to true in its Info.plist"）。
        # 传统 WatchKit 2.0 app（带 WatchKit Extension）才用 WKWatchKitApp=true。
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: top.webchangming.watchstep
        WKBackgroundModes:
          - self-care
        NSMotionUsageDescription: 读取步数，用于判断你这两天有没有走动。
        # 上传优先走家里局域网（192.168.31.82:8085，纯 HTTP，不用 TLS、不出公网），
        # 失败才回退到 Cloudflare 域名（HTTPS）。局域网那条是明文 HTTP，默认被 ATS 拦，
        # 而 IP 字面量没法用 NSExceptionDomains 配，只能整体放开。
        # 这个 app 只自签给自己用，不进 App Store，没有审核约束。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIDeviceFamily:
          - 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.webchangming.watchstep.watchkitapp
        COMPANION_BUNDLE_ID: top.webchangming.watchstep
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
