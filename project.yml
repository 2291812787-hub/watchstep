# XcodeGen 工程描述 —— 不需要 Mac，CI 上自动生成 .xcodeproj
# 关键：默认配置**不要求任何付费能力**（无 Push、无 HealthKit、无 App Groups），
# 所以可以用免费 Apple ID + iLoader 自签，7 天重刷一次即可。
name: WatchStep

options:
  bundleIdPrefix: top.webchangming
  deploymentTarget:
    iOS: "16.0"
    # 8.0 → 10.0：复杂功能用的 WidgetKit 扩展要求不低于宿主 App。
    # 宿主 8.0 / 扩展 10.0 这种组合 Xcode 会直接报错
    # （"The app extension has a deployment target greater than the
    # containing app's"），而且 accessory 那几款表盘槽位本来也要 watchOS 9+。
    # 这台表是 watchOS 27，抬到 10.0 没有任何代价。
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "4.15"
    CURRENT_PROJECT_VERSION: "45"
    SWIFT_VERSION: "5.0"
    # 自签路线：手动签名，不自动要描述文件
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  # ---------- iOS 壳：只是容器 ----------
  WatchStep:
    type: application
    platform: iOS
    sources:
      - Sources/WatchStep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.webchangming.step
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 催步
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: WatchStepWatch
        embed: true

  # ---------- watchOS 独立 App：真正的全部逻辑 ----------
  WatchStepWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/WatchStepWatch
        excludes:
          - "Info.plist"
      - path: Sources/WatchStepCore
      - path: Sources/WatchStepShared
    dependencies:
      - target: WatchStepWidget
        embed: true
    info:
      path: Sources/WatchStepWatch/Info.plist
      properties:
        CFBundleDisplayName: 催步
        CFBundleName: WatchStep
        # 版本号必须和 iPhone 端一致：Apple 要求 companion app 与手表 app 的
        # CFBundleShortVersionString / CFBundleVersion 相同，否则 installd 可能
        # 拒绝安装或事后被 watchOS 移除。Xcode 会展开 $(...) 构建变量。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SwiftUI 单 target watchOS app（无 WatchKit Extension）必须声明 WKApplication=true，
        # 否则 installd 报 InvalidWatchKitApp 拒绝安装（"does not have a WKWatchKitApp or
        # WKApplication key set to true in its Info.plist"）。
        # 传统 WatchKit 2.0 app（带 WatchKit Extension）才用 WKWatchKitApp=true。
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: top.webchangming.step
        WKBackgroundModes:
          - self-care
        NSMotionUsageDescription: 读取步数，用于判断你这两天有没有走动。
        # 这里刻意不放 NSAppTransportSecurity 和 NSLocalNetworkUsageDescription。
        # 2.4(14) 就是没有这两个键、只走 HTTPS 公网，服务器收到了 09:55 / 10:23
        # 两条（src_ip 127.0.0.1）。后来加 ATS 想放开局域网明文，反而踩坑：
        # NSAllowsLocalNetworking 一出现，NSAllowsArbitraryLoads 会被系统忽略，
        # 而 LocalNetworking 只覆盖 .local / 无点主机名，不覆盖 IP 字面量 ——
        # 等于局域网没放开、公网的通行证还作废了。既然公网 HTTPS 本来就够用，
        # 就把这两个键都去掉，回到那一版的干净状态。
        UIDeviceFamily:
          - 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.webchangming.step.watchkitapp
        COMPANION_BUNDLE_ID: top.webchangming.step
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""

  # ---------- 表盘复杂功能（WidgetKit 扩展） ----------
  #
  # 为什么必须新建一个 .appex：这是 SwiftUI 单 target 的 watchOS App
  # （WKApplication=true，没有 WatchKit Extension），而复杂功能的数据源
  # 必须有个容器来承载。ClockKit 那条老路需要 Extension 才能挂 datasource，
  # 我们这里无处可挂，所以只能走 WidgetKit 扩展。
  #
  # 代价是 IPA 里多一层嵌套 bundle，iloader 要单独为它签名 —— 这是本步唯一的风险点。
  WatchStepWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: Sources/WatchStepWidget
        excludes:
          - "Info.plist"
      - path: Sources/WatchStepShared
    info:
      path: Sources/WatchStepWidget/Info.plist
      properties:
        CFBundleDisplayName: 步数进度
        # 扩展的版本号必须和主 App、手表 App 完全一致，否则 installd 直接拒绝
        # （"The CFBundleVersion of an app extension must match that of its
        # containing parent app"）。三处都走同一组构建变量，不要手写数字。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 这一条以前漏了，是表盘永远不动的真凶。
        # 扩展里用 CMPedometer 读步数，缺少这句 watchOS 会直接终止扩展进程，
        # 表现就是：步数冻结、进度条冻结，只有系统自己画的倒计时还在走。
        NSMotionUsageDescription: 读取步数，用于在表盘显示本轮进度。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.webchangming.step.watchkitapp.widget
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
